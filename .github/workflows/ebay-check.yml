name: Probar conexión eBay (sin publicar ofertas)

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Mercado de eBay"
        required: true
        default: "ES"
        type: choice
        options: [ES, FR, DE, IT, NL, BE, IE]
      query:
        description: "Búsqueda para prueba técnica"
        required: true
        default: "auriculares inalámbricos"
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar búsqueda de eBay sin exportar ni guardar resultados
        env:
          EBAY_ENV: sandbox
          EBAY_SANDBOX_CLIENT_ID: ${{ secrets.EBAY_SANDBOX_CLIENT_ID }}
          EBAY_SANDBOX_CLIENT_SECRET: ${{ secrets.EBAY_SANDBOX_CLIENT_SECRET }}
                    MARKET: ${{ inputs.market }}
          SEARCH_QUERY: ${{ inputs.query }}
        run: |
          python scripts/ebay_browse.py --market "$MARKET" --query "$SEARCH_QUERY" --limit 10
